<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
   <h1>My To-Do List</h1>
   <p class="subtitle">Stay organized and get things done 🚀</p>

   <div id="statsBar">
    <span id="totalTasks">📋 Total: 0</span>
    <span id="activeTasks">⏳ Active: 0</span>
    <span id="completedTasks">✅ Completed: 0</span>
  </div>
  
  <p id="progressText">Progress: 0%</p>

  <div id="progressContainer">
    <div id="progressBar"></div>
</div>


<input type="text" id="taskInput" placeholder="Enter a task">
<button id="addBtn">Add Task</button>

<div>
    <button id="allBtn">All</button>
    <button id="activeBtn">Active</button>
    <button id="completedBtn">Completed</button>
</div>

<p id="taskCounter">Tasks Left: 0</p>

<ul id="taskList"></ul>
<script src="script.js"></script>
<p class="footer">
    Built with ❤️ by Pradee
</p>
<div id="toast"></div>
</div>
</body>
</html>
